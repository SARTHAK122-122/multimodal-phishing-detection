# Dashboard: SPA fallback + API proxy to the Spring Boot container.
#
# The axios client is built with VITE_API_BASE_URL=/api, so every API call
# stays same-origin and no CORS configuration is needed in the container
# deployment. Long read timeout: website scans with headless rendering take
# up to ~2 minutes end-to-end; multipart upload cap matches Spring's 12 MB.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 12m;
    }

    # SPA fallback: every other route renders index.html, client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite; cache them, never the shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
