# =====================================================================
# Multimodal Phishing Detection Platform - container deployment.
#
#   docker compose up --build
#
#   Dashboard   http://localhost:5173   (nginx: SPA + /api proxy)
#   Backend     http://localhost:8088   (Spring Boot, also reachable via nginx)
#   AI service  internal only (not published) - reached by the backend
#   PostgreSQL  internal only (data in the pgdata volume)
#
# Shared volumes:  ./models -> /app/models (ro, trained artifacts)
#                  uploads   -> /app/uploads (QR uploads, screenshots,
#                               processed datasets - shared by backend and
#                               AI service exactly like the local layout)
# =====================================================================
name: phishing-detection

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishing_detection}
      POSTGRES_USER: ${POSTGRES_USER:-phish_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      PROJECT_ROOT: /app
      MODEL_DIR: /app/models
      UPLOAD_DIR: /app/uploads
      PROCESSED_DIR: /app/uploads/processed
      # Optional defence-in-depth: when set, /analyze/* requires the same
      # value in X-AI-Service-Key. Left unset here because the service is
      # not published outside the compose network. Set it (and configure
      # the backend) if you ever do publish it.
      # AI_SERVICE_API_KEY: change-me
    volumes:
      - ./models:/app/models:ro
      - uploads:/app/uploads
    # Not published: only the backend talks to it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-phishing_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-phish_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
      PROCESSED_DIR: /app/uploads/processed
      AI_SERVICE_READ_TIMEOUT_MS: "120000"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
