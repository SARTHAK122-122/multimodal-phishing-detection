# ============================================================
# Spring Boot configuration.
# Every secret comes from the environment (.env) - no hard-coded
# credentials beyond local-development defaults.
# ============================================================
spring.application.name=multimodal-phishing-backend

# ---------- Datasource (PostgreSQL) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/phishing_detection}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:phish_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_this_password}
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA ----------
# Schema ownership stays with Flyway; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway migrations ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}
spring.flyway.validate-on-migrate=true
# Allows the schema to have been applied manually with psql first (scripts/setup-database.ps1)
spring.flyway.baseline-on-migrate=true

# ---------- HTTP server ----------
# Port 8088: another Java process already occupies 8080 on this machine.
# Override with SERVER_PORT if 8080 is free for you.
server.port=${SERVER_PORT:8088}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Sessions (login) ----------
# Server-side HTTP session for the signed-in user: HttpOnly (no JS access),
# SameSite=Lax (browsers do not attach it to cross-site state-changing
# requests), 8 hours of idle convenience for demos.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- AI service ----------
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=3000
# Website scans fetch + render in headless Chromium, which can take ~40-60s on a
# slow page; the read timeout must exceed the AI service's own fetch/render caps.
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:120000}

# ---------- File storage ----------
storage.upload-dir=${UPLOAD_DIR:../uploads}
storage.processed-dir=${PROCESSED_DIR:../uploads/processed}
storage.max-upload-bytes=52428800

# ---------- Multipart (QR image uploads) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://sarthak122-122.github.io}

# ---------- Logging ----------
logging.level.com.phishingdet=INFO
